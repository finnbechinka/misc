// general
fps_max "0"
fps_max_tools "0"
fps_max_ui "0"								
cl_join_advertise "2"
sensitivity "1.5"
zoom_sensitivity_ratio "1"
mm_csgo_community_search_players_min "7"
mm_dedicated_search_maxping "50"
con_enable "1"
r_fullscreen_gamma "2.1"
rate 1000000
cl_allow_animated_avatars 0
cl_use_opens_buy_menu 0
cl_teammate_colors_show 1

log_color VProf FB12FFFF | grep %

alias "go_warm" "map aim_training_quick_warmup"

//snd_remove_soundevent Flashbang.Ring.Short
//snd_remove_soundevent Flashbang.Ring.Long
//snd_remove_soundevent Flashbang.Ring.Medium

// viewmodel
//viewmodel_presetpos 3
//viewmodel_offset_x 2.5
//viewmodel_offset_y 0
//viewmodel_offset_z -2
viewmodel_presetpos 0
viewmodel_fov 64
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5

// hud settings
cl_radar_always_centered "1"
cl_radar_icon_scale_min "0.6"
cl_radar_rotate "1"
cl_radar_scale "0.4"
cl_radar_square_with_scoreboard "0"
cl_hud_radar_scale "1.1"
hud_scaling ".95"
cl_hud_color "2"
cl_showloadout "1"
safezonex "1"
safezoney "1"

// Custom Binds
bind "x" "+radialradio"
alias "+longch" "cl_crosshairsize 1000;alias "longch" "-longch""
alias "-longch" "cl_crosshairsize 2.5;alias "longch" "+longch""
alias "longch" "+longch"
cl_teamid_overhead_mode 1
bind "alt" "+cl_show_team_equipment"
bind "c" "slot6"
bind "p" "messagemode"
bind "o" "messagemode2"
bind "h" "slot12"
bind "F1" "slot8"
bind "F3" "slot10"
bind "4" "slot7"
bind "5" "slot4;slot5;"
bind "MOUSE5" "slot5"
//bind "MOUSE5" "slot7"
bind "F5" "radio"
bind "F6" "radio1"
bind "F7" "radio2"
bind "F8" "radio3"
bind "SHIFT" "+sprint"
bind "CTRL" "+duck"
bind "t" "+spray_menu"


**LONG JUMP BINDS
alias +nforward "+forward_s1;"
alias +nback "+back_s1;"
alias +nleft "+left_s1;"
alias +nright "+right_s1;"
alias -nforward "-forward_s1;"
alias -nback "-back_s1;"
alias -nleft "-left_s1;"
alias -nright "-right_s1;"
bind w +nforward
bind a +nleft
bind s +nback
bind d +nright

alias +forward_s1   "+forward_s1_"
alias +forward_s1_  "+forward;  alias +forward_s1;  alias -forward_s1 -forward_s1_"
alias -forward_s1   ""
alias -forward_s1_  "-forward;  alias -forward_s1;  alias +forward_s1 +forward_s1_"

alias +back_s1      "+back_s1_"
alias +back_s1_     "+back;  alias +back_s1;  alias -back_s1 -back_s1_"
alias -back_s1      ""
alias -back_s1_     "-back;  alias -back_s1;  alias +back_s1 +back_s1_"

alias +left_s1      "+left_s1_"
alias +left_s1_     "+left;  alias +left_s1;  alias -left_s1 -left_s1_"
alias -left_s1      ""
alias -left_s1_     "-left;  alias -left_s1;  alias +left_s1 +left_s1_"

alias +right_s1     "+right_s1_"
alias +right_s1_    "+right;  alias +right_s1;  alias -right_s1 -right_s1_"
alias -right_s1     ""
alias -right_s1_    "-right;  alias -right_s1;  alias +right_s1 +right_s1_"
alias +jump_s1      "+jump_s1_"
alias +jump_s1_     "+jump;  alias +jump_s1;  alias -jump_s1 -jump_s1_"
alias -jump_s1      ""
alias -jump_s1_     "-jump;  alias -jump_s1;  alias +jump_s1 +jump_s1_"
alias +duck_s1      "+duck_s1_"
alias +duck_s1_     "+duck;  alias +duck_s1;  alias -duck_s1 -duck_s1_"
alias -duck_s1      ""
alias -duck_s1_     "-duck;  alias -duck_s1;  alias +duck_s1 +duck_s1_"

alias s1_binds      "bind w +forward_s1;  bind s +back_s1;  bind a +left_s1;  bind d +right_s1;  bind space +jump_s1;  bind ctrl +duck_s1"
alias s2_binds      "bind w +forward;     bind s +back;     bind a +left;     bind d +right;     bind space +jump;     bind ctrl +duck"

alias +ljnb "-forward_s1;-forward_s1;-forward_s1;-back_s1;-back_s1;-back_s1;+jump_s1;+jump_s1;"
alias -ljnb "-jump_s1;-jump_s1;-jump_s1;"

alias +lj "+ljnb;+ljnb;+duck_s1;+duck_s1:-forward"
alias -lj "-ljnb;-ljnb;-ljnb;-duck_s1;-duck_s1;-duck_s1"

alias +ljjb "+ljnb;-duck_s1"
alias -ljjb "-ljnb"

//lj
alias +lj "+ljnb;+ljnb;+duck_s1;+duck_s1"
alias -lj "-ljnb;-ljnb;-ljnb;-duck_s1;-duck_s1;-duck_s1"

//null cfg (frick nulls)
alias chknforward
alias chknback
alias chknleft
alias chknright
alias +nforward "-back_s1;+forward_s1;alias chknforward +forward_s1"
alias +nback "-forward_s1;+back_s1;alias chknback +back_s1"
alias +nleft "-right_s1;+left_s1;alias chknleft +left_s1"
alias +nright "-left_s1;+right_s1;alias chknright +right_s1"
alias -nforward "-forward_s1;chknback;alias chknforward"
alias -nback "-back_s1;chknforward;alias chknback"
alias -nleft "-left_s1;chknright;alias chknleft"
alias -nright "-right_s1;chknleft;alias chknright"
bind w +nforward
bind a +nleft
bind s +nback
bind d +nright


bind mwheelup "+lj"
bind mwheeldown "+jump;-jump"
alias "+j" "+duck;+jump"
alias "-j" "-duck;-jump"
bind space "+j"

alias +throw "-attack; -attack2"
bind "v" "+jump;+throw"

alias +walkjumpthrow "+forward; +jump"
alias "-walkjumpthrow" "-jump; -forward"
bind "n" "+walkjumpthrow; +throw"

bind r "+reload; +throw"

