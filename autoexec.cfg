alias "x3" "xdefault; cl_crosshairalpha "245"; cl_crosshaircolor "1"; cl_crosshairgap "-2"; cl_crosshairsize "2";"
alias "xtwistzz" "xdefault; cl_crosshairalpha 240; cl_crosshaircolor 4; cl_crosshairgap -3; cl_crosshairsize 2;"
alias "xniko" "xdefault; cl_crosshaircolor 5; cl_crosshairgap -4; cl_crosshairsize 1; cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255;"
alias "xniko2" "xdefault; cl_crosshaircolor 4; cl_crosshairgap -4; cl_crosshairsize 1; cl_crosshairthickness 0;"
